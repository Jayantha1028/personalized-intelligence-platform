version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: antigravity-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - SECRET_KEY=production-secure-random-secret-key-replace-in-env
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","https://antigravity.platform"]
    volumes:
      - platform_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: antigravity-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  platform_data:
    driver: local
